name: Build
on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.38.5'
  NDK_VERSION: r28c
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_gz: "DimLifeVPN-Linux-x64-AppImage.tar"
  TARGET_NAME_AppImage: "DimLifeVPN-Linux-x64-AppImage"
  TARGET_NAME_deb: "DimLifeVPN-Debian-x64"
  # TARGET_NAME_rpm: "DimLifeVPN-rpm-x64"
  TARGET_NAME_apk: "DimLifeVPN-Android"
  TARGET_NAME_aab: "DimLifeVPN-Android"
  TARGET_NAME_exe: "DimLifeVPN-Windows-Setup-x64"
  TARGET_NAME_msix: "DimLifeVPN-Windows-x64"
  TARGET_NAME_zip: "DimLifeVPN-Windows-Portable-x64"
  TARGET_NAME_dmg: "DimLifeVPN-MacOS"
  TARGET_NAME_pkg: "DimLifeVPN-MacOS-Installer"
  TARGET_NAME_ipa: "DimLifeVPN-iOS"
  

jobs:
  test:
    outputs:
      draftBuildCode: ${{ steps.draftBuildCode.outputs.datetime }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0 #issue with 2.13
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: Prepare
        run: make linux-amd64-prepare
      - name: Test
        run: flutter test

      - name: make draftBuildCode
        id: draftBuildCode
        run: echo "::set-output name=datetime::$(date +'%d.%H.%M')"


  build:
    needs: test
    permissions:
      contents: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-apk
            os: ubuntu-latest
            targets: apk
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Import Apple Codesign Certificates
        if: ${{ inputs.upload-artifact && startsWith(matrix.os,'macos') }}
        uses: apple-actions/import-codesign-certs@v6
        with: 
            p12-file-base64: "${{ secrets.APPLE_CERTIFICATE_P12 }}"
            p12-password: "${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}"

      - name: Import Apple Mobile Provisioning Profile
        if: ${{ inputs.upload-artifact && startsWith(matrix.os,'macos') }}
        run: |
           mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
           echo "${{secrets.APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64}}"|base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
           ls ~/Library/MobileDevice/Provisioning\ Profiles
           security unlock-keychain -p "" signing_temp.keychain
           security find-identity -v -p codesigning
        #   ls ~/Library/MobileDevice/Provisioning\ Profiles
        #   echo "${{secrets.NEW_APPLE_MOBILE_PROVISIONING_PROFILES_TARXZ_BASE64}}"|base64 --decode | tar xJ -C ~/Library/MobileDevice/Provisioning\ Profiles
        #   # echo "${{secrets.NEW_APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64_2}}"|base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
          


      # - name: Setup Flutter for arm64
      #   if: ${{ startsWith(matrix.platform,'linux-arm64') }}
      #   uses: hurelhuyag/flutter-arm64-action@HEAD
      #   with:
      #     channel: 'stable'
      #     flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0 #issue with 2.13
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Clean up disk space
        if: startsWith(matrix.platform,'android')
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          df -h
          sudo rm -rf /opt/ghc
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
          rm -rf ~/.gradle/caches
          df -h
          sudo apt-get autoremove -y
          df -h
          sudo apt-get clean 
          df -h
          tree
      
      - name: Setup Java
        if: startsWith(matrix.platform,'android')
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
      # - name: Setup NDK
      #   if: startsWith(matrix.platform,'android')
      #   uses: nttld/setup-ndk@v1
      #   id: setup-ndk
      #   with:
      #     ndk-version: ${{ env.NDK_VERSION }}
      #     add-to-path: true
      #     link-to-sdk: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        if: startsWith(matrix.platform,'android')
        with:
          # default also installs the legacy 'tools' package, which no longer exists
          packages: platform-tools
      # - name: Cache Android SDK
      #   uses: actions/cache@v5
      #   if: startsWith(matrix.platform,'android')
      #   with:
      #     path: |
      #       /usr/local/lib/android/sdk
      #     key: android-sdk-${{ runner.os }}-${{ env.NDK_VERSION }}
      #     restore-keys: |
      #       android-sdk-${{ runner.os }}-      
      - name: Cache Gradle
        uses: actions/cache@v5
        if: startsWith(matrix.platform,'android')

        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
                  
      - name: Setup dependencies
        run: |
          make ${{ matrix.platform }}-install-deps  
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Setup Android Signing Properties
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'android') && inputs.tag-name != 'draft' }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/key.jks
          echo "storeFile=$(pwd)/android/key.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> android/key.properties

      - name: Setup Windows Signing Properties
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') }}
        run: |
            [IO.File]::WriteAllBytes("windows\sign.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGNING_KEY }}"))
            (Get-Content "windows\packaging\msix\make_config.yaml") -replace '^certificate_password:.*$', 'certificate_password: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}' | Set-Content "windows\packaging\msix\make_config.yaml"
            # Fail early with a readable reason instead of SignTool's "No certificates were found"
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("windows\sign.pfx", "${{ secrets.WINDOWS_SIGNING_PASSWORD }}")
            Write-Host "Signing cert: $($cert.Subject) thumbprint=$($cert.Thumbprint) valid $($cert.NotBefore) -> $($cert.NotAfter)"
            if (-not $cert.HasPrivateKey) { throw "WINDOWS_SIGNING_KEY has no private key" }
            if ($cert.NotAfter -lt (Get-Date)) { throw "Windows signing certificate expired on $($cert.NotAfter); update WINDOWS_SIGNING_KEY / WINDOWS_SIGNING_PASSWORD / WINDOWS_SIGNING_SHA1" }
            if ("${{ secrets.WINDOWS_SIGNING_SHA1 }}" -and $cert.Thumbprint -ne "${{ secrets.WINDOWS_SIGNING_SHA1 }}".ToUpper()) { Write-Warning "WINDOWS_SIGNING_SHA1 does not match the certificate thumbprint" }

      # - name: Temporary disable Permission Handler for windows due to its issue in permission
      #   if: ${{ startsWith(matrix.platform,'windows') }}
      #   run: |
      #     (Get-Content -Path "pubspec.yaml") -notmatch "permission_handler" | Set-Content -Path "pubspec.yaml"
      #     (Get-Content -Path "lib\features\profile\add\add_profile_modal.dart") -notmatch "qr_code_scanner_screen" | Set-Content -Path "lib\features\profile\add\add_profile_modal.dart"
      #     (Get-Content -Path lib\features\profile\add\add_profile_modal.dart) -replace 'await QRCodeScannerScreen\(\).open\(context\);', 'null;' | Set-Content -Path lib\features\profile\add\add_profile_modal.dart
      #     Remove-Item -Path "lib\features\common\qr_code_scanner_screen.dart"




      - name: Prepare for ${{ matrix.platform }}
        run: |
          make ${{ matrix.platform }}-prepare


      - name: Build ${{ matrix.platform }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          make ${{ matrix.platform }}-release

      - name: Code Sign
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') }}
        # signtool-code-sign actions hardcode an SDK path (10.0.17763.0) missing on current runners,
        # so locate signtool from whichever Windows SDK is installed.
        env:
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          Write-Host "Using $($signtool.FullName)"
          $pfx = Resolve-Path "windows\sign.pfx"
          $exts = '.dll','.exe','.sys','.msix','.msixbundle','.appx','.appxbundle','.msi','.msp','.msm','.cab','.ps1','.psm1'
          $files = Get-ChildItem dist -Recurse -File | Where-Object { $exts -contains $_.Extension.ToLower() }
          foreach ($file in $files) {
            Write-Host "Signing $($file.FullName)"
            $ok = $false
            foreach ($attempt in 1..5) {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /d DimLifeVPN /f $pfx /p $env:SIGN_PASSWORD $file.FullName
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds $attempt
            }
            if (-not $ok) { throw "failed to sign $($file.FullName)" }
          }

      - name: Copy to out Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse | Select-Object FullName
          New-Item -ItemType Directory -Path "out" -Force | Out-Null
          $targets = "${{ matrix.targets }}".Split(',')
          foreach ($ext in $targets) {
            $ext = $ext.Trim()
            $key = "TARGET_NAME_$ext"
            $targetName = (Get-Item "env:$key").Value
            
            $files = Get-ChildItem -Path dist -Recurse -Filter "*.$ext"
            
            foreach ($file in $files) {
                $destination = Join-Path -Path "out" -ChildPath "$targetName.$ext"
                Move-Item -Path $file.FullName -Destination $destination -Force
            }
          }
          Get-ChildItem -Path out
          
      - name: Upload Debug Symbols
        if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DIST: ${{ matrix.platform == 'android-aab' && 'google-play' || 'general' }}
        run: |
          dart pub global activate sentry_dart_plugin
          dart run sentry_dart_plugin 
      
      

              
      - name: Copy to out Android APK
        if: matrix.platform == 'android-apk'
        run: |
          mkdir out
          ls -R ./build/app/outputs
          cp ./build/app/outputs/flutter-apk/*arm64-v8a*.apk out/${TARGET_NAME_apk}-arm64.apk || echo "no arm64 apk"
          cp ./build/app/outputs/flutter-apk/*armeabi-v7a*.apk out/${TARGET_NAME_apk}-arm7.apk || echo "no arm7 apk"
          cp ./build/app/outputs/flutter-apk/*x86_64*.apk out/${TARGET_NAME_apk}-x86_64.apk || echo "no x64 apk"
          cp ./build/app/outputs/flutter-apk/app-release.apk out/${TARGET_NAME_apk}-universal.apk || echo "no universal apk"

      - name: Copy to out Android AAB
        if: matrix.platform == 'android-aab'
        run: |
          mkdir out
          ls -R ./build/app/outputs
          cp ./build/app/outputs/bundle/release/app-release.aab out/DimLifeVPN-Android.aab || echo "no aab"

      - name: Copy to out unix
        if: startsWith(matrix.platform,'linux') || matrix.platform == 'macos' || matrix.platform == 'ios'
        run: |
          ls -R dist/
          mkdir out
          mkdir tmp_out
          
          for EXT in $(echo ${{ matrix.targets }} | tr ',' '\n'); do
            KEY=TARGET_NAME_${EXT}
            FILENAME=${!KEY}
            echo "For $EXT ($KEY) filename is ${FILENAME}"
            mv dist/*/*.$EXT tmp_out/${FILENAME}.$EXT
            ls tmp_out
            [[ "$EXT" != "gz" ]] && chmod +x tmp_out/${FILENAME}.$EXT || echo "Skipping chmod for gz"
            if [ "${{matrix.platform}}" == "linux" ];then
              cp ./.github/help/linux/* tmp_out/
            else
              cp ./.github/help/mac-windows/* tmp_out/
            fi
            if [[ "${{matrix.platform}}" == 'ios' ]];then
              echo mv tmp_out/${FILENAME}.$EXT out/
              mv tmp_out/${FILENAME}.$EXT out/
            else
              cd tmp_out
              # 7z a ${FILENAME}.zip ./
              # mv ${FILENAME}.zip ../out/
              # [[ $EXT == 'AppImage' ]]&& mv ${FILENAME}.$EXT ../out/ # added for appimage link
              mv ${FILENAME}.$EXT ../out/
              cd ..
            fi
          done

      - name: Upload Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{matrix.platform}}
          path: ./out
          retention-days: 1

      - name: Clean up keychain and provisioning profile
        if: ${{ always() && startsWith(matrix.os,'macos')}}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db ||echo ok
          rm ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision ||echo ok

  publish-release:
    name: Publish Android APK files
    needs: build
    if: ${{ inputs.upload-artifact && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Android build artifact
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: release-assets

      - name: Verify APKs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            DimLifeVPN-Android-arm64.apk \
            DimLifeVPN-Android-arm7.apk \
            DimLifeVPN-Android-universal.apk \
            DimLifeVPN-Android-x86_64.apk; do
            if [[ ! -s "release-assets/$file" ]]; then
              echo "::error::Expected APK is missing: $file"
              exit 1
            fi
          done
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          echo "Files that will be published:"
          ls -lh release-assets

      - name: Update rolling draft tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f draft "$GITHUB_SHA"
          git push --force origin refs/tags/draft

      - name: Create or update Android release and upload individual files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_BODY="$(cat .github/release_message.md)"
          RELEASE_NAME="DimLifeVPN — Android (последняя сборка)"

          if RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/draft" 2>/dev/null)"; then
            RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f name="$RELEASE_NAME" \
              -F draft=false \
              -F prerelease=true \
              -f body="$RELEASE_BODY"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name=draft \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$RELEASE_NAME" \
              -F draft=false \
              -F prerelease=true \
              -f body="$RELEASE_BODY"
          fi

          gh release upload draft \
            release-assets/DimLifeVPN-Android-arm64.apk \
            release-assets/DimLifeVPN-Android-arm7.apk \
            release-assets/DimLifeVPN-Android-universal.apk \
            release-assets/DimLifeVPN-Android-x86_64.apk \
            release-assets/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
